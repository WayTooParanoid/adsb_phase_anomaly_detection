phase_classifier:
  focus: primary_arrival_departure
  min_phase_confidence: 0.55
  relevant_phases:
  - INITIAL_APPROACH
  - INTERMEDIATE_APPROACH
  - FINAL_APPROACH
  - DEPARTURE
  - ENROUTE_CLIMB
  thresholds:
    outer_arrival:
      max_speed_kt: 452.449
      min_altitude_agl_ft: 6563.286
    focused_terminal_arrival:
      max_distance_airport_nm: 55.281
      max_end_altitude_agl_ft: 13249.0
      max_mean_altitude_agl_ft: 14043.097
      max_delta_altitude_ft: -625.0
      max_vertical_rate_fpm: -744.727
      min_speed_kt: 165.217
      max_speed_kt: 372.571
    final_arrival:
      max_distance_airport_nm: 19.32
      max_end_altitude_agl_ft: 1899.0
      max_mean_altitude_agl_ft: 2124.0
      min_speed_kt: 81.829
      max_speed_kt: 198.64
    departure:
      min_delta_altitude_ft: 1275.0
      min_vertical_rate_fpm: 1418.667
      max_start_altitude_agl_ft: 4849.0
      min_speed_kt: 155.775
    enroute_climb:
      min_delta_altitude_ft: 950.0
      min_vertical_rate_fpm: 1176.0
      min_speed_kt: 243.38
      min_mean_altitude_agl_ft: 7239.466
      max_mean_altitude_agl_ft: 26528.167
      min_start_altitude_agl_ft: 6124.0
context:
  airport_scope: primary_only
dbscan:
  default_eps: 1.0
  training_phases:
  - INITIAL_APPROACH
  - INTERMEDIATE_APPROACH
  - FINAL_APPROACH
  - DEPARTURE
  - ENROUTE_CLIMB
  training_filter:
    primary_airport_only: true
    airport_context_types:
    - arrival
    - departure
    - terminal
  eps_selection:
    enabled: true
    method: kth_neighbor_percentile
    percentile: 90
    min_eps: 0.25
    max_eps: 2.5
  min_unique_tracks_by_phase:
    INITIAL_APPROACH: 4
    INTERMEDIATE_APPROACH: 5
    FINAL_APPROACH: 5
    DEPARTURE: 5
    ENROUTE_CLIMB: 4
  feature_weights_by_phase:
    INITIAL_APPROACH:
      delta_altitude_ft: 1.3
      mean_vertical_rate_fpm: 1.2
    INTERMEDIATE_APPROACH:
      delta_altitude_ft: 1.5
      mean_vertical_rate_fpm: 1.3
      mean_ground_speed_kt: 1.0
      heading_change_deg: 1.2
      sinuosity: 1.2
    FINAL_APPROACH:
      delta_altitude_ft: 1.8
      mean_vertical_rate_fpm: 1.7
      max_abs_vertical_rate_fpm: 1.4
      mean_ground_speed_kt: 1.1
      heading_change_deg: 1.4
      sinuosity: 1.3
    DEPARTURE:
      delta_altitude_ft: 1.5
      mean_vertical_rate_fpm: 1.3
      delta_ground_speed_kt: 1.2
    ENROUTE_CLIMB:
      delta_altitude_ft: 1.3
      mean_vertical_rate_fpm: 1.2
