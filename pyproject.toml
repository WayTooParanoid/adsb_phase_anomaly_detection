[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-phase-dbscan"
version = "0.1.0"
description = "Phase-specific aviation-aware DBSCAN for ADS-B anomaly detection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "requests>=2.31",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adsb_phase_dbscan = ["dashboard_assets/*.html"]
