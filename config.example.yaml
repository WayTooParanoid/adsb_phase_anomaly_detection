airport:
  id: JFK
  name: JFK
  lat: 40.6413
  lon: -73.7781
  elevation_ft: 13

airports:
  - id: JFK
    name: John F. Kennedy International Airport
    lat: 40.6413
    lon: -73.7781
    elevation_ft: 13
    arrival_radius_nm: 45
    departure_radius_nm: 25
    ground_radius_nm: 5
    terminal_radius_nm: 60
    runways:
      - id: 04L/22R
        bearing_deg: 44
  - id: LGA
    name: LaGuardia Airport
    lat: 40.7769
    lon: -73.8740
    elevation_ft: 21
  - id: EWR
    name: Newark Liberty International Airport
    lat: 40.6895
    lon: -74.1745
    elevation_ft: 18

data:
  max_time_gap_minutes: 15
  segment_seconds: 60
  segment_step_seconds: 30
  min_points_per_segment: 5
  stale_seen_pos_seconds: 30

dbscan:
  default_eps: 1.0
  train_unknown_phase: false
  training_phases:
    - INITIAL_APPROACH
    - INTERMEDIATE_APPROACH
    - FINAL_APPROACH
    - DEPARTURE
    - ENROUTE_CLIMB
  eps_selection:
    enabled: false
    method: kth_neighbor_percentile
    percentile: 90
    min_eps: 0.25
    max_eps: 2.5
  min_unique_tracks_by_phase:
    INITIAL_APPROACH: 4
    INTERMEDIATE_APPROACH: 5
    FINAL_APPROACH: 5
    DEPARTURE: 5
    ENROUTE_CLIMB: 4
  feature_weights_by_phase:
    INITIAL_APPROACH:
      delta_altitude_ft: 1.3
      mean_vertical_rate_fpm: 1.2
    INTERMEDIATE_APPROACH:
      delta_altitude_ft: 1.5
      mean_vertical_rate_fpm: 1.3
      heading_change_deg: 1.2
      sinuosity: 1.2
    FINAL_APPROACH:
      delta_altitude_ft: 1.8
      mean_vertical_rate_fpm: 1.7
      max_abs_vertical_rate_fpm: 1.4
      heading_change_deg: 1.4
      sinuosity: 1.3
    DEPARTURE:
      delta_altitude_ft: 1.5
      mean_vertical_rate_fpm: 1.3
      delta_ground_speed_kt: 1.2
    ENROUTE_CLIMB:
      delta_altitude_ft: 1.3
      mean_vertical_rate_fpm: 1.2
  min_samples_by_phase:
    INITIAL_APPROACH: 10
    INTERMEDIATE_APPROACH: 20
    FINAL_APPROACH: 20
    DEPARTURE: 20
    ENROUTE_CLIMB: 10
  tolerances_by_phase:
    INITIAL_APPROACH:
      xy_m: 50000
      altitude_ft: 3000
      speed_kt: 100
      vertical_rate_fpm: 1500
      heading_deg: 30
      delta_altitude_ft: 1500
      delta_distance_nm: 15
    INTERMEDIATE_APPROACH:
      xy_m: 20000
      altitude_ft: 2000
      speed_kt: 80
      vertical_rate_fpm: 1500
      heading_deg: 35
      delta_altitude_ft: 1500
      delta_distance_nm: 15
    FINAL_APPROACH:
      xy_m: 10000
      altitude_ft: 1000
      speed_kt: 50
      vertical_rate_fpm: 1000
      heading_deg: 20
      delta_altitude_ft: 800
      delta_distance_nm: 8
    DEPARTURE:
      xy_m: 20000
      altitude_ft: 2500
      speed_kt: 90
      vertical_rate_fpm: 1800
      heading_deg: 30
      delta_altitude_ft: 1800
      delta_distance_nm: 15
    ENROUTE_CLIMB:
      xy_m: 50000
      altitude_ft: 3000
      speed_kt: 100
      vertical_rate_fpm: 1500
      heading_deg: 30
      delta_altitude_ft: 1500
      delta_distance_nm: 15

live:
  api_url_template: "https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}"
  radius_nm: 50
  airport_marker_top_k: 12
  poll_seconds: 2
  track_history_points: 80
  stale_aircraft_seconds: 120
  alert_window_segments: 10
  alert_min_segments: 5
  alert_anomaly_ratio: 0.3
  user_agent: "adsb-phase-dbscan-class-project/0.1"

context:
  min_confidence: 0.55
  arrival_confidence: 0.8
  departure_confidence: 0.8
  ground_confidence: 0.9
  runway_max_bearing_error_deg: 18
  runway_max_lateral_offset_nm: 2.5
  runway_max_threshold_distance_nm: 20
  runway_min_closure_nm: 0.25

phase_classifier:
  focus: primary_arrival_departure
  min_phase_confidence: 0.55
  relevant_phases:
    - INITIAL_APPROACH
    - INTERMEDIATE_APPROACH
    - FINAL_APPROACH
    - DEPARTURE
    - ENROUTE_CLIMB
  thresholds: {}

phase_assignment:
  max_best_score: 1.35
  min_score_margin_ratio: 0.90
